# Fetch NDBC buoy 46042 four times a day and commit it to the `data` branch,
# where the site reads it from raw.githubusercontent.com (NDBC itself has no
# CORS headers). Times are UTC; :17 avoids GitHub's top-of-hour backlog.
# In Pacific time that's about 5a, 11a, 5p and 11p (an hour earlier in
# winter); swell-plan.md has the table.
name: Fetch buoy data

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ndbc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the script
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts

      - name: Check out the data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch 46042
        run: node scripts/fetch-ndbc.mjs data 46042

      - name: Commit if changed
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "NDBC 46042 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
